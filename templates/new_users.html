{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Nuevo Usuario</h4>
        </div>
        <div class="card-body">
            <form id="newUserForm" enctype="multipart/form-data">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">DNI/NIE</label>
                        <input type="text" class="form-control" name="doc_number" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Primer Apellido</label>
                        <input type="text" class="form-control" name="last_name" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Tipo de Documento</label>
                        <select class="form-select" name="doc_type_id" required>
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Segundo Apellido</label>
                        <input type="text" class="form-control" name="second_last_name">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Teléfono Fijo</label>
                        <input type="tel" class="form-control" name="phone_number">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Teléfono Móvil</label>
                        <input type="tel" class="form-control" name="mobile_number">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Sexo</label>
                        <select class="form-select" name="sex">
                            <option value="">Seleccionar...</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                            <option value="O">Otro</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Dirección</label>
                        <input type="text" class="form-control" name="address">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Código Postal</label>
                        <input type="text" class="form-control" name="postal_code" maxlength="10">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Ciudad</label>
                        <select class="form-select" name="city_id">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Acciones</label>
                        <select class="form-select" name="actions" required>
                            <option value="">Seleccionar...</option>
                            {% for accion in ["Espera", "Citada", "Atendida", "No interesa", "Ocupada", "No acude", "Derivada", "No contesta"] %}
                            <option value="{{ accion }}">{{ accion }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Incidencia</label>
                        <select class="form-select" name="incident">
                            <option value="">Seleccionar...</option>
                            {% for inc in ["Ninguna", "Error de conexión", "No hay información", "Baja administrativa", "Participante con otra entidad", "Error NIE"] %}
                            <option value="{{ inc }}">{{ inc }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Entidad</label>
                        <select class="form-select" name="entity_id" required>
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Grupo Social</label>
                        <select class="form-select" name="social_group_id">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Fecha de Nacimiento</label>
                        <input type="date" class="form-control" name="birth_date">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Sexo</label>
                        <select class="form-select" name="sex">
                            <option value="">Seleccionar...</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                            <option value="O">Otro</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">DNI/NIE (archivo)</label>
                        <input type="file" class="form-control" name="dni_file" accept=".pdf,.doc,.docx">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Certificado Extranjería</label>
                        <input type="file" class="form-control" name="cert_extr_file" accept=".pdf,.doc,.docx">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Vida Laboral</label>
                        <input type="file" class="form-control" name="vida_laboral_file" accept=".pdf,.doc,.docx">
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Guardar Usuario
                        </button>
                        <a href="/usuarios" class="btn btn-secondary">
                            <i class="bi bi-x"></i> Cancelar
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
document.addEventListener('DOMContentLoaded', async function() {
    const form = document.getElementById('newUserForm');
    
    // Load document types
    try {
        const docTypesResponse = await fetch('/get_id_docs');
        const docTypes = await docTypesResponse.json();
        const docTypeSelect = form.elements['doc_type_id'];
        docTypes.forEach(doc => {
            const option = document.createElement('option');
            option.value = doc.doc_type_id;
            option.textContent = doc.doc_name;
            docTypeSelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading document types:', error);
    }

    // Load cities
    try {
        const citiesResponse = await fetch('/get_cities_list');
        const cities = await citiesResponse.json();
        const citySelect = form.elements['city_id'];
        cities.forEach(city => {
            const option = document.createElement('option');
            option.value = city.id;
            option.textContent = city.name;
            citySelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading cities:', error);
    }

    // Load entities
    try {
        const entitiesResponse = await fetch('/get_entities_list');
        const entities = await entitiesResponse.json();
        const entitySelect = form.elements['entity_id'];
        entities.forEach(entity => {
            const option = document.createElement('option');
            option.value = entity.id;
            option.textContent = entity.name;
            entitySelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading entities:', error);
    }

    // Load social groups
    try {
        const groupsResponse = await fetch('/get_social_groups_list');
        const groups = await groupsResponse.json();
        const groupSelect = form.elements['social_group_id'];
        groups.forEach(group => {
            const option = document.createElement('option');
            option.value = group.id;
            option.textContent = group.name;
            groupSelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading social groups:', error);
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        // Basic form validation
        const requiredFields = ['doc_type_id', 'doc_number', 'name', 'last_name', 'actions', 'entity_id'];
        for (const field of requiredFields) {
            const input = form.elements[field];
            if (!input.value.trim()) {
                alert(`El campo ${input.labels[0].textContent.trim()} es obligatorio`);
                input.focus();
                return;
            }
        }

        // DNI/NIE validation
        const dni = form.elements['doc_number'].value;
        if (!/^\d{8}[A-Za-z]$/.test(dni)) {
            alert('El DNI/NIE debe tener 8 dígitos seguidos de una letra');
            form.elements['doc_number'].focus();
            return;
        }

        // Phone validation (if provided)
        const phone = form.elements['phone_number'].value;
        const mobile = form.elements['mobile_number'].value;
        if (phone && !/^[0-9]{9}$/.test(phone)) {
            alert('El teléfono fijo debe tener 9 dígitos');
            form.elements['phone_number'].focus();
            return;
        }
        if (mobile && !/^[0-9]{9}$/.test(mobile)) {
            alert('El teléfono móvil debe tener 9 dígitos');
            form.elements['mobile_number'].focus();
            return;
        }

        try {
            const formData = new FormData(this);
            const response = await fetch('/add_new_user', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const result = await response.json();
            if (result.success) {
                window.location.href = '/usuarios';
            } else {
                alert(result.error || 'Error al crear el usuario');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error al crear el usuario');
        }
    });
});
</script>
{% endblock %}
