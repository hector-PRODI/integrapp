{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Nuevo Usuario</h4>
        </div>
        <div class="card-body">
            <form id="newUserForm" enctype="multipart/form-data">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Tipo de Documento *</label>
                        <select class="form-select" name="doc_type_id" required>
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Número de Documento *</label>
                        <input type="text" class="form-control" name="doc_number" required 
                               placeholder="Seleccione tipo de documento primero">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Nombre *</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Primer Apellido *</label>
                        <input type="text" class="form-control" name="last_name" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Segundo Apellido</label>
                        <input type="text" class="form-control" name="second_last_name">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Sexo</label>
                        <select class="form-select" name="sex">
                            <option value="">Seleccionar...</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                            <option value="O">Otro</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Teléfono Fijo</label>
                        <input type="tel" class="form-control" name="phone_number">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Teléfono Móvil</label>
                        <input type="tel" class="form-control" name="mobile_number">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Fecha de Nacimiento</label>
                        <input type="date" class="form-control" name="birth_date">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Dirección</label>
                        <input type="text" class="form-control" name="address">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Código Postal</label>
                        <input type="text" class="form-control" name="postal_code" maxlength="10">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Ciudad</label>
                        <select class="form-select" name="city_id">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Acciones</label>
                        <select class="form-select" name="actions" required>
                            <option value="">Seleccionar...</option>
                            {% for accion in ["Espera", "Citada", "Atendida", "No interesa", "Ocupada", "No acude", "Derivada", "No contesta"] %}
                            <option value="{{ accion }}">{{ accion }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Incidencia</label>
                        <select class="form-select" name="incident">
                            <option value="">Seleccionar...</option>
                            {% for inc in ["Ninguna", "Error de conexión", "No hay información", "Baja administrativa", "Participante con otra entidad", "Error NIE"] %}
                            <option value="{{ inc }}">{{ inc }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Entidad</label>
                        <select class="form-select" name="entity_id" required>
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Grupo Social</label>
                        <select class="form-select" name="social_group_id">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">DNI/NIE (archivo)</label>
                        <input type="file" class="form-control" name="dni_file" accept=".pdf,.doc,.docx">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Certificado Extranjería</label>
                        <input type="file" class="form-control" name="cert_extr_file" accept=".pdf,.doc,.docx">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Vida Laboral</label>
                        <input type="file" class="form-control" name="vida_laboral_file" accept=".pdf,.doc,.docx">
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Guardar Usuario
                        </button>
                        <a href="/usuarios" class="btn btn-secondary">
                            <i class="bi bi-x"></i> Cancelar
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
document.addEventListener('DOMContentLoaded', async function() {
    const form = document.getElementById('newUserForm');

    // Load cities
    try {
        const citiesResponse = await fetch('/get_cities_list');
        const cities = await citiesResponse.json();
        const citySelect = form.elements['city_id'];
        cities.forEach(city => {
            const option = document.createElement('option');
            option.value = city.id;
            option.textContent = city.name;
            citySelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading cities:', error);
    }

    // Load entities
    try {
        const entitiesResponse = await fetch('/get_entities_list');
        const entities = await entitiesResponse.json();
        const entitySelect = form.elements['entity_id'];
        entities.forEach(entity => {
            const option = document.createElement('option');
            option.value = entity.id;
            option.textContent = entity.name;
            entitySelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading entities:', error);
    }

    // Load social groups
    try {
        const groupsResponse = await fetch('/get_social_groups_list');
        const groups = await groupsResponse.json();
        const groupSelect = form.elements['social_group_id'];
        groups.forEach(group => {
            const option = document.createElement('option');
            option.value = group.id;
            option.textContent = group.name;
            groupSelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading social groups:', error);
    }

    // Load ID docs
    try {
        const docsResponse = await fetch('/get_id_docs');
        const docs = await docsResponse.json();
        const docSelect = form.elements['doc_type_id'];
        docs.forEach(doc => {
            const option = document.createElement('option');
            option.value = doc.doc_type_id;
            option.textContent = doc.doc_name;
            docSelect.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading ID docs:', error);
    }

    // Handle form submission
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        try {
            const formData = new FormData(form);
            
            const response = await fetch('/add_new_user', {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || 'Error al crear usuario');
            }
            
            const result = await response.json();
            
            if (result.success) {
                alert('Usuario creado exitosamente');
                window.location.href = '/usuarios';
            } else {
                throw new Error(result.error || 'Error desconocido al crear usuario');
            }
            
        } catch (error) {
            console.error('Error:', error);
            alert(error.message || 'Error al crear usuario. Por favor, inténtelo de nuevo.');
        }
    });

    // Add document type validation
    const docTypeSelect = form.elements['doc_type_id'];
    const docNumber = form.elements['doc_number'];

    docTypeSelect.addEventListener('change', function() {
        const docType = this.value;
        
        // Update placeholder and pattern based on document type
        if (docType === 'DOC_DNI') {
            docNumber.placeholder = '12345678A';
            docNumber.pattern = '^\\d{8}[A-Za-z]$';
            docNumber.title = 'DNI debe tener 8 números seguidos de una letra';
        } else if (docType === 'DOC_NIE') {
            docNumber.placeholder = 'Y1234567Z';
            docNumber.pattern = '^[XYZ]\\d{7}[A-Za-z]$';
            docNumber.title = 'NIE debe empezar con X, Y o Z, seguido de 7 números y una letra';
        } else if (docType === 'DOC_PASAPORTE') {
            docNumber.placeholder = 'Número de pasaporte';
            docNumber.pattern = '.+';
            docNumber.title = 'Ingrese número de pasaporte';
        }
    });
});
</script>
{% endblock %}
