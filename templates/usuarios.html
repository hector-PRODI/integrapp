{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Usuarios</h4>
            <a href="/new_users" class="btn btn-light">
                <i class="bi bi-plus"></i> Nuevo Usuario
            </a>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped" id="usersTable">
                    <thead>
                        <tr>
                            <th>DNI/NIE</th>
                            <th>Nombre</th>
                            <th>Apellidos</th>
                            <th>Teléfono</th>
                            <th>Colectivo</th>
                            <th>Acciones</th>
                            <th>Entidad</th>
                            <th>Proyectos</th>
                            <th>Opciones</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const socket = io();
    
    async function getProjectName(projectId) {
        try {
            const response = await fetch(`/project/${projectId}`);
            const data = await response.json();
            return data.name;
        } catch (error) {
            console.error('Error fetching project name:', error);
            return projectId;
        }
    }
    
    async function loadUsers() {
        try {
            const response = await fetch('/get_users');
            const users = await response.json();
            console.log('Retrieved users:', users);  // Debug log
            const tbody = document.querySelector('#usersTable tbody');
            tbody.innerHTML = '';
            
            for (const user of users) {
                const tr = document.createElement('tr');
                
                // Format projects as a comma-separated list
                let projectsHtml = 'No asignado';
                if (user.projects && user.projects.length > 0) {
                    projectsHtml = user.projects.map(projectId => 
                        `<a href="/project/${projectId}">${projectId}</a>`
                    ).join(', ');
                }
                
                tr.innerHTML = `
                    <td>${user.dni_nie}</td>
                    <td>${user.nombre}</td>
                    <td>${user.apellido1} ${user.apellido2 || ''}</td>
                    <td>${user.telefono}</td>
                    <td>${user.colectivo}</td>
                    <td>${user.acciones}</td>
                    <td>${user.entidad_asignada}</td>
                    <td>${projectsHtml}</td>
                    <td>
                        <a href="/user_profile/${user.dni_nie}" class="btn btn-sm btn-info">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a href="/edit_user/${user.dni_nie}" class="btn btn-sm btn-primary">
                            <i class="bi bi-pencil"></i>
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        } catch (error) {
            console.error('Error loading users:', error);
        }
    }

    // Load users initially
    loadUsers();

    // Reload when socket receives update
    socket.on('update', function(data) {
        if (data.table === 'users' || !data.table) {
            loadUsers();
        }
    });
});
</script>
{% endblock %}
