{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Editar Usuario - {{ user.nombre }} {{ user.apellido1 }}</h4>
        </div>
        <div class="card-body">
            <form id="editUserForm" enctype="multipart/form-data">
                <input type="hidden" name="dni_nie" value="{{ user.dni_nie }}">
                <!-- Personal Information -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5 class="mb-0">Información Personal</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">DNI/NIE</label>
                                <input type="text" class="form-control" value="{{ user.dni_nie }}" readonly>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" name="nombre" value="{{ user.nombre }}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Primer Apellido</label>
                                <input type="text" class="form-control" name="apellido1" value="{{ user.apellido1 }}" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Segundo Apellido</label>
                                <input type="text" class="form-control" name="apellido2" value="{{ user.apellido2 or '' }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" name="telefono" value="{{ user.telefono }}" required 
                                       pattern="[0-9]{9}" title="Debe ser un número de teléfono válido de 9 dígitos">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Gesprodi</label>
                                <input type="text" class="form-control" name="gesprodi" value="{{ user.gesprodi or '' }}">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Sexo</label>
                                <select class="form-select" name="sex">
                                    <option value="">Seleccionar...</option>
                                    <option value="M" {% if user.sex == "M" %}selected{% endif %}>Masculino</option>
                                    <option value="F" {% if user.sex == "F" %}selected{% endif %}>Femenino</option>
                                    <option value="O" {% if user.sex == "O" %}selected{% endif %}>Otro</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" name="birth_date" 
                                       value="{{ user.birth_date.strftime('%Y-%m-%d') if user.birth_date else '' }}">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Program Information -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5 class="mb-0">Información del Programa</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Grupo Social</label>
                                <select class="form-select" name="colectivo" required>
                                    <option value="">Seleccionar...</option>
                                    {% for group in ["Inactivo", "Discapacidad", "Mayores", "Exclusión", "Inmigrante", 
                                                   "Joven sin experiencia laboral", "Mayores de 45"] %}
                                    <option value="{{ group }}" {% if user.colectivo == group %}selected{% endif %}>{{ group }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Acciones</label>
                                <select class="form-select" name="acciones" required>
                                    {% set acciones = ["Espera", "Citada", "Atendida", "No interesa", "Ocupada", "No acude", "Derivada", "No contesta"] %}
                                    {% for accion in acciones %}
                                    <option value="{{ accion }}" {% if user.acciones == accion %}selected{% endif %}>{{ accion }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Incidencia</label>
                                <select class="form-select" name="incidencia">
                                    {% set incidencias = ["Ninguna", "Error de conexión", "No hay información", "Baja administrativa", "Participante con otra entidad", "Error NIE"] %}
                                    <option value="">Seleccionar...</option>
                                    {% for inc in incidencias %}
                                    <option value="{{ inc }}" {% if user.incidencia == inc %}selected{% endif %}>{{ inc }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Entidad Asignada</label>
                                <select class="form-select" name="entidad_asignada" required>
                                    {% set entidades = ["Prodiversa", "Mitad del cielo", "Acompanya", "Forprocer"] %}
                                    {% for ent in entidades %}
                                    <option value="{{ ent }}" {% if user.entidad_asignada == ent %}selected{% endif %}>{{ ent }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Acceso Programa</label>
                                <select class="form-select" name="acceso_programa" required>
                                    <option value="Sí" {% if user.acceso_programa == "Sí" %}selected{% endif %}>Sí</option>
                                    <option value="No" {% if user.acceso_programa == "No" %}selected{% endif %}>No</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Observations -->
                <div class="card mb-3">
                    <div class="card-header">
                        <h5 class="mb-0">Observaciones</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-12">
                                <textarea class="form-control" name="observaciones" rows="3">{{ user.observaciones or '' }}</textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Submit Buttons -->
                <div class="row">
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Guardar Cambios
                        </button>
                        <a href="/user_profile/{{ user.dni_nie }}" class="btn btn-secondary">
                            <i class="bi bi-x"></i> Cancelar
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('editUserForm');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        // Basic form validation
        const requiredFields = ['nombre', 'apellido1', 'telefono', 'colectivo', 'acciones', 'entidad_asignada', 'acceso_programa'];
        for (const field of requiredFields) {
            const input = form.elements[field];
            if (!input.value.trim()) {
                alert(`El campo ${input.labels[0].textContent.trim()} es obligatorio`);
                input.focus();
                return;
            }
        }

        // Phone validation
        const phone = form.elements['telefono'].value;
        if (!/^[0-9]{9}$/.test(phone)) {
            alert('El teléfono debe tener 9 dígitos');
            form.elements['telefono'].focus();
            return;
        }

        // Prepare form data
        const formData = new FormData(this);
        const data = {};
        formData.forEach((value, key) => {
            if (value) {
                // Handle date fields
                if (key === 'birth_date' && value) {
                    data[key] = value;  // Keep date in YYYY-MM-DD format
                } else {
                    data[key] = value;
                }
            }
        });

        try {
            const response = await fetch('/update_user', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const result = await response.json();
            if (result.success) {
                window.location.href = '/user_profile/{{ user.dni_nie }}';
            } else {
                alert(result.error || 'Error al actualizar el usuario');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error al actualizar el usuario');
        }
    });
});
</script>
{% endblock %}
